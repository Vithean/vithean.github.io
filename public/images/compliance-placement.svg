<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Where compliance sits</title>
<desc id="figDesc">Two routes to a compliant Cambodian invoice. On a typical international platform, the accounting software passes to a separate e-invoicing tool from another vendor before reaching CamInv, and the status has to be matched back to the books by hand. With Vithean, invoicing, VAT, the ledger and the CamInv connection are one system, and the status and official XML and PDF return to the same record.</desc>
