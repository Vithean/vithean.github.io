name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — refresh YouTube playlist
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action majors are pinned to the current release of each, which is not
      # the same number across the four: the runner is dropping the Node 20
      # runtime these were built on, and each action moved off it separately.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro 7 declares engines.node >= 22.12.0. On Node 20 the build
          # fails here rather than on a developer's machine, so this pin has
          # to move with any Astro major.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch YouTube playlist
        run: npm run fetch:videos
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
